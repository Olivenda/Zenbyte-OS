name: Feature request
description: Propose a new feature, driver, or shell command.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like Zenbite to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve, or what experience does it enable?
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: Sketch of an approach (optional)
