name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 mtools dosfstools \
                                  build-essential gcc-multilib

      - name: Build Zenbite
        run: make

      - name: Boot test in QEMU
        run: make test
