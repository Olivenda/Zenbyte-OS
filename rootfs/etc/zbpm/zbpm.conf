# /etc/zbpm/zbpm.conf
# Sourced by /usr/bin/zbpm at startup. Plain Bash assignments.
# Any value can also be overridden via the environment.

# Refuse to install packages without a valid GPG signature and SHA256.
# Set to 0 only for local development against an unsigned local repo.
ZBPM_REQUIRE_SIGNATURE=1

# Maximum recursion depth when resolving dependencies (cycle protection).
ZBPM_MAX_DEPS_DEPTH=64

# Network timeout per HTTP request, in seconds.
ZBPM_HTTP_TIMEOUT=30

# Whitespace-separated list of allowed install path prefixes.
# Any tarball member whose target path falls outside this list is rejected,
# and the same list is enforced again at remove-time on every manifest entry.
ZBPM_INSTALL_PREFIX_ALLOW="/usr/ /etc/ /opt/ /var/lib/zbpm/scripts/"

# Default language for messages: en, de.
# Falls back to ${LANG%%.*} if unset.
#ZBPM_LANG=en

# Override paths if you really need to.
#ZBPM_DB=/var/lib/zbpm
#ZBPM_CACHE=/var/cache/zbpm
#ZBPM_LOG=/var/log/zbpm.log
#ZBPM_KEYRING=/etc/zbpm/keys
