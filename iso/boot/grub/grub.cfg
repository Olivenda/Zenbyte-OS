set timeout=5
set default=0

# Live ISO entry. Uses the filesystem label rather than /dev/sda so the
# image boots regardless of how the host enumerates the install media.
menuentry "ZenbyteOS (live)" {
    search --no-floppy --label --set=root ZenbyteOS
    linux  /boot/vmlinuz root=LABEL=ZenbyteOS rw quiet
    initrd /boot/initramfs.img
}

menuentry "ZenbyteOS (live, verbose)" {
    search --no-floppy --label --set=root ZenbyteOS
    linux  /boot/vmlinuz root=LABEL=ZenbyteOS rw
    initrd /boot/initramfs.img
}

menuentry "ZenbyteOS (German menu)" {
    search --no-floppy --label --set=root ZenbyteOS
    linux  /boot/vmlinuz root=LABEL=ZenbyteOS rw quiet lang=de
    initrd /boot/initramfs.img
}
